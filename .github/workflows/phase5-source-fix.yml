name: Apply Phase 5 source corrections

on:
  push:
    branches:
      - codex/milestone-5-d180

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply targeted source corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          phase5 = Path('src/game/phase5.ts')
          text = phase5.read_text()
          text = text.replace(
              'function chooseMinerNode(state: GameState, member: CrewMember, floor: FloorState): MiningNode | undefined {',
              'function chooseMinerNode(_state: GameState, member: CrewMember, floor: FloorState): MiningNode | undefined {'
          )
          phase5.write_text(text)

          main = Path('src/mainPhase5.ts')
          text = main.read_text()
          needle = '    updatePhase5(state, FIXED_STEP);\n'
          replacement = needle + "    if ((state.run.depth.current as string) === 'D-180') state.meta.bestDepth = 'D-180' as DepthId;\n"
          if replacement not in text:
              text = text.replace(needle, replacement)
          main.write_text(text)

          test = Path('tests/phase5.test.ts')
          text = test.read_text()
          needle = '    const state = prepareRun2Crew(5009);\n'
          replacement = needle + "    (state.run.depth.unlocked as string[]).push('D-180');\n"
          if replacement not in text:
              text = text.replace(needle, replacement)
          test.write_text(text)
          PY
      - name: Commit corrections
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/game/phase5.ts src/mainPhase5.ts tests/phase5.test.ts
          git commit -m 'fix: address Phase 5 validation findings'
          git push
