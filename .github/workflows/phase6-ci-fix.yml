name: Phase 6 CI repair

on:
  push:
    branches:
      - codex/milestone-6-deep-game

permissions:
  contents: write

jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[phase6-ci-fix]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/milestone-6-deep-game
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/phase6-ci-fix.mjs
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: stabilize Phase 6 validation [phase6-ci-fix]"
          git push origin HEAD:codex/milestone-6-deep-game
