name: Phase 5 validation

on:
  push:
    branches:
      - codex/milestone-5-d180
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Test
        id: test
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt
      - name: Report failure details
        if: always() && github.event_name == 'pull_request' && (steps.test.outcome == 'failure' || steps.build.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Phase 5 validation diagnostics'
            echo
            echo '<details><summary>npm test</summary>'
            echo
            echo '```text'
            tail -n 160 test-output.txt
            echo '```'
            echo '</details>'
            echo
            echo '<details><summary>npm run build</summary>'
            echo
            echo '```text'
            tail -n 160 build-output.txt
            echo '```'
            echo '</details>'
          } > validation-comment.md
          gh pr comment "$PR_NUMBER" --body-file validation-comment.md
      - name: Enforce validation
        if: steps.test.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
